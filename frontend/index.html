<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cloud Native Platform</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="page-shell">
      <header class="topbar">
        <div>
          <p class="eyebrow">Cloud Native DevSecOps Platform</p>
          <h1>Operations Portal</h1>
        </div>
        <button class="primary-btn" id="refreshBtn">Refresh data</button>
      </header>

      <main class="dashboard">
        <section class="card overview">
          <h2>Platform health</h2>
          <div class="status-list">
            <div><span>User Service</span><strong id="userHealth">Loading...</strong></div>
            <div><span>Product Service</span><strong id="productHealth">Loading...</strong></div>
            <div><span>Order Service</span><strong id="orderHealth">Loading...</strong></div>
          </div>
        </section>

        <section class="card">
          <h2>Users</h2>
          <ul id="userList"></ul>
        </section>

        <section class="card">
          <h2>Products</h2>
          <ul id="productList"></ul>
        </section>

        <section class="card wide">
          <h2>Orders</h2>
          <ul id="orderList"></ul>
        </section>
      </main>
    </div>

    <script src="app.js"></script>
  </body>
</html>
