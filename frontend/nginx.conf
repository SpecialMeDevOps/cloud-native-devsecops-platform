server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  location /api/users/ {
    proxy_pass http://user-service:8001/;
  }

  location /api/products/ {
    proxy_pass http://product-service:8002/;
  }

  location /api/orders/ {
    proxy_pass http://order-service:8003/;
  }

  location / {
    try_files $uri /index.html;
  }
}
