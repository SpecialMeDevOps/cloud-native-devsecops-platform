apiVersion: v1
kind: Namespace
metadata:
  name: cloud-platform
---
apiVersion: v1
kind: LimitRange
metadata:
  name: default-limits
  namespace: cloud-platform
spec:
  limits:
    - type: Container
      default:
        cpu: 200m
        memory: 256Mi
      defaultRequest:
        cpu: 100m
        memory: 128Mi
