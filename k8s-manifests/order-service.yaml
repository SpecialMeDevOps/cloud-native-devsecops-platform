apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-service
  namespace: cloud-platform
spec:
  replicas: 2
  selector:
    matchLabels:
      app: order-service
  template:
    metadata:
      labels:
        app: order-service
    spec:
      containers:
        - name: order-service
          image: order-service:latest
          ports:
            - containerPort: 8003
          env:
            - name: USER_SERVICE_URL
              value: http://user-service:8001
            - name: PRODUCT_SERVICE_URL
              value: http://product-service:8002
          readinessProbe:
            httpGet:
              path: /health
              port: 8003
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8003
            initialDelaySeconds: 15
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: order-service
  namespace: cloud-platform
spec:
  selector:
    app: order-service
  ports:
    - port: 8003
      targetPort: 8003
