apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cloud-platform
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/SpecialMeDevOps/Cloud-Native-Microservices-DevOps-Project.git
    targetRevision: HEAD
    path: k8s-manifests
  destination:
    server: https://kubernetes.default.svc
    namespace: cloud-platform
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=false
      - PruneLast=true
      - ApplyOutOfSyncOnly=true
